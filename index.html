<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6f8">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>偏差値そろばん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one subject sheet at a time (tabs), answer-sheet paper with red-pen marks; overview strip at the bottom */
:root{
  --paper:#f3f6f8; --sheet:#ffffff; --ink:#1d2a33; --muted:#5d6c77; --rule:#d5dee5;
  --red:#d2362f; --redsoft:#fbe7e5; --good:#1f7a55;
  --kokugo:#7a4fa3; --sansu:#2266b8; --shakai:#b26a12; --rika:#1f7f6e; --total:#3a4650;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12181d; --sheet:#1a2229; --ink:#e6edf2; --muted:#93a3ae; --rule:#2c3740;
  --red:#ff6b61; --redsoft:#3a1f1d; --good:#5fd19d;
  --kokugo:#b591da; --sansu:#6fa6ec; --shakai:#e3a14f; --rika:#5cc4b1; --total:#a9b6c0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12181d; --sheet:#1a2229; --ink:#e6edf2; --muted:#93a3ae; --rule:#2c3740;
  --red:#ff6b61; --redsoft:#3a1f1d; --good:#5fd19d;
  --kokugo:#b591da; --sansu:#6fa6ec; --shakai:#e3a14f; --rika:#5cc4b1; --total:#a9b6c0; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header h1{font-size:24px;font-weight:900;margin:0;letter-spacing:.02em}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{font:700 14px var(--sans);padding:9px 0;border-radius:8px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;border-top:5px solid var(--c)}
.sheet h2{margin:0;font-size:18px;font-weight:900;color:var(--c);display:flex;justify-content:space-between;align-items:baseline}
.sheet h2 small{font:500 12px var(--sans);color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fields.four{grid-template-columns:repeat(4,1fr)}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input{font:700 18px var(--mono);width:100%;box-sizing:border-box;padding:8px 6px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--redsoft);border-radius:10px}
.hero .k{font-size:13px;font-weight:700}
.hero .v{font:700 30px var(--mono);color:var(--red);font-variant-numeric:tabular-nums}
.hero .s{font-size:12px;color:var(--muted);flex-basis:100%;margin-top:-4px}
.msg{font-size:13px;color:var(--muted);padding:10px 12px;border:1px dashed var(--rule);border-radius:8px}
.warn{color:var(--red);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--rule)}
th{font-size:12px;color:var(--muted);font-weight:500}
td{font:500 15px var(--mono)}
td:first-child,th:first-child{text-align:left}
td.up{color:var(--good);font-weight:700}
tr.cap td{color:var(--muted)}
.target{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--redsoft);border-radius:10px}
.target h3{margin:0 !important}
.fifty{display:flex;flex-direction:column;gap:2px;padding:14px;background:var(--redsoft);border-radius:10px}
.fifty .k{font-size:13px;font-weight:700}
.fifty .v{font:700 30px var(--mono);color:var(--red)}
.fifty .s{font-size:12.5px;color:var(--muted)}
.clear{align-self:flex-start;font:700 13px var(--sans);padding:9px 14px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.clear:active{background:var(--rule)}
.steps td{padding:9px 6px}
.steps td.pl{font-weight:700;color:var(--muted)}
.steps td b{font:700 18px var(--mono)}
.steps .u{font:500 12px var(--sans);color:var(--muted);margin-left:2px}
.steps .diff{font:700 12px var(--mono);color:var(--good);margin-left:8px}
.target h3{margin:6px 0 0;font-size:14px}
.trow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{width:80px;text-align:center}
.stp{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--red);background:var(--sheet);color:var(--red);font:700 22px var(--sans);line-height:1;cursor:pointer;touch-action:manipulation}
.stp:active{background:var(--red);color:#fff}
.tres{font-size:15px;min-width:0}
.tres b{font:700 20px var(--mono);color:var(--red)}
.ov h3{margin:0 0 6px;font-size:14px}
.ov{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.note{font-size:12px;color:var(--muted);line-height:1.7}
.btnrow{display:flex;gap:8px;justify-content:flex-end}
.ghost{font:500 12px var(--sans);background:none;border:1px solid var(--rule);color:var(--muted);border-radius:6px;padding:5px 10px;cursor:pointer}
.ex{font-size:11px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:0 5px;margin-left:6px}
@media (max-width:380px){.fields.four{grid-template-columns:repeat(2,1fr)}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>偏差値そろばん</h1>
    <p>平均点・自分の得点・偏差値を入れると「あと何点で偏差値がいくつ上がるか」がわかります。</p>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <section class="sheet" id="sheet" aria-live="polite"></section>

  <section class="ov">
    <h3>4教科の比較（1点あたりの偏差値）</h3>
    <table id="ov"></table>
    <p class="note" style="margin:8px 0 0">1点の重みが大きい教科ほど、同じ努力で偏差値が伸びやすい教科です。</p>
  </section>

  <p class="note">
    しくみ：偏差値 = 50 + 10 ×（得点 − 平均）÷ 標準偏差。発表された3つの数字から逆算しています。偏差値は小数第1位で四捨五入されて発表されるため、得点が平均点に近いと誤差が大きくなります。<br>
    4科合計の偏差値は、各教科の偏差値の平均とは一致しません。合計の平均点・得点・偏差値を「4科」タブに入れてください。
  </p>
  <div class="btnrow"><button class="ghost" id="reset">入力をすべて消す</button></div>
</div>

<script>
const SUBJ=[
  {id:"kokugo",name:"国語",max:150,ex:{mean:82.4,score:96,dev:56.1}},
  {id:"sansu",name:"算数",max:150,ex:{mean:74.8,score:88,dev:54.3}},
  {id:"shakai",name:"社会",max:100,ex:{mean:58.2,score:64,dev:53.0}},
  {id:"rika",name:"理科",max:100,ex:{mean:55.6,score:52,dev:47.9}},
  {id:"total",name:"4科",max:500,ex:{mean:271.0,score:300,dev:55.2}},
];
const KEY="hensachi-v1";
let state={tab:"kokugo",data:{},example:true};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.data){state=s}}catch(e){}
SUBJ.forEach(s=>{if(!state.data[s.id])state.data[s.id]={mean:s.ex.mean,score:s.ex.score,dev:s.ex.dev,max:s.max,sd:"",target:""}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

const num=v=>{const n=parseFloat(String(v).replace(/[^\d.\-]/g,""));return isFinite(n)?n:null};
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const f2=n=>n.toFixed(2);

function calc(d){
  const mean=num(d.mean),score=num(d.score),dev=num(d.dev),max=num(d.max),sdIn=null;
  if(mean!==null&&score!==null&&Math.abs(score-mean)<1e-9)return{fifty:true,mean,score};
  if(mean===null||score===null||dev===null)return{err:"受験者平均点・自分の得点・自分の偏差値の3つを入れてください。"};
  let sd,warn=null,src="逆算";
  if(sdIn&&sdIn>0){sd=sdIn;src="入力値"}
  else{
    if(Math.abs(dev-50)<0.05)return{err:"偏差値が50ちょうど（平均点と同じ）のときは計算できません。",needSd:true};
    sd=10*(score-mean)/(dev-50);
    if(!(sd>0))return{err:"得点と平均点の大小と、偏差値（50より上か下か）が合っていません。数字を確認してください。",needSd:true};
    const rel=0.05/Math.abs(dev-50);
    if(rel>0.03)warn=`平均との差が小さいため、結果に約±${Math.round(rel*100)}%の誤差があります。`;
  }
  const per=10/sd;
  const devOf=x=>50+10*(x-mean)/sd;
  const scoreFor=t=>mean+(t-50)*sd/10;
  return{mean,score,dev,max,sd,per,devOf,scoreFor,warn,src};
}

const C=id=>`var(--${id})`;
function renderTabs(){
  const t=document.getElementById("tabs");t.innerHTML="";
  SUBJ.forEach(s=>{const b=document.createElement("button");b.className="tab";b.role="tab";b.id="tab-"+s.id;
    b.style.setProperty("--c",C(s.id));b.textContent=s.name;b.setAttribute("aria-selected",state.tab===s.id);
    b.onclick=()=>{state.tab=s.id;save();renderTabs();renderSheet()};t.appendChild(b)});
}

function renderSheet(){
  const s=SUBJ.find(x=>x.id===state.tab),d=state.data[s.id],el=document.getElementById("sheet");
  el.style.setProperty("--c",C(s.id));
  el.innerHTML=`
   <h2>${s.name}${state.example?'<span class="ex">例の数字</span>':''}<small>満点 <input id="f-max" value="${d.max??""}" inputmode="decimal" style="width:64px;font-size:14px;padding:3px 5px;display:inline-block"></small></h2>
   <div class="fields">
     <label>受験者平均点<input id="f-mean" inputmode="decimal" value="${d.mean??""}"></label>
     <label>自分の得点<input id="f-score" inputmode="decimal" value="${d.score??""}"></label>
     <label>自分の偏差値<input id="f-dev" inputmode="decimal" value="${d.dev??""}"></label>
   </div>
   <button class="clear" id="clear" type="button">データリセット</button>
   <div id="out"></div>`;
  ["mean","score","dev","max"].forEach(k=>{
    const i=document.getElementById("f-"+k);
    i.addEventListener("input",()=>{d[k]=i.value;state.example=false;save();renderOut();renderOv();
      el.querySelector(".ex")?.remove()});
  });
  document.getElementById("clear").onclick=()=>{
    ["mean","score","dev"].forEach(k=>{d[k]="";document.getElementById("f-"+k).value=""});
    state.example=false;save();el.querySelector(".ex")?.remove();renderOut();renderOv();
    document.getElementById("f-mean").focus()};
  renderOut();
}

function renderOut(){
  const s=SUBJ.find(x=>x.id===state.tab),d=state.data[s.id],o=document.getElementById("out"),r=calc(d);
  if(r.fifty){
    const di=document.getElementById("f-dev");
    if(di&&num(di.value)!==50){di.value="50";d.dev="50";save()}
    o.innerHTML=`<div class="fifty"><span class="k">平均点と同じ得点なので</span><span class="v">偏差値 50</span><span class="s">得点が平均点と同じ回は、「何点上がれば偏差値がいくつ上がるか」を計算できません。</span></div>`;
    return}
  if(r.err){o.innerHTML=`<div class="msg">${r.err}</div>`;return}
  const rows=[];
  for(let p=5;p<=50;p+=5){const x=r.score+p;if(r.max&&x>r.max)break;
    rows.push(`<tr><td class="pl">+${p}点</td><td>${x}<span class="u">点</span></td><td><b>${f1(r.devOf(x))}</b><span class="diff">+${f1(p*r.per)}</span></td></tr>`);
    if(rows.length>=8)break}
  o.innerHTML=`
   <div class="target">
     <h3>目標の偏差値から逆算</h3>
     <div class="trow"><label for="f-target" style="flex-direction:row">目標偏差値</label><div class="stepper"><button type="button" class="stp" id="t-down" aria-label="目標偏差値を1下げる">−</button><input id="f-target" inputmode="decimal" value="${d.target||Math.ceil(r.dev)+3}"><button type="button" class="stp" id="t-up" aria-label="目標偏差値を1上げる">＋</button></div></div>
     <div class="tres" id="tres"></div>
   </div>
   ${r.warn?`<div class="warn">${r.warn}</div>`:""}
   ${rows.length?`<table class="steps"><thead><tr><th>上げ幅</th><th>得点</th><th>偏差値</th></tr></thead><tbody>${rows.join("")}</tbody></table>`:`<div class="msg">満点のため、これ以上の得点はありません。</div>`}`;
  const ti=document.getElementById("f-target");
  const upd=()=>{d.target=ti.value;save();const t=num(ti.value),tr=document.getElementById("tres");
    if(t===null){tr.textContent="";return}
    const need=Math.ceil(r.scoreFor(t)-1e-9),diff=need-r.score;
    if(r.max&&need>r.max){tr.innerHTML=`満点（${r.max}点）でも偏差値 ${f1(r.devOf(r.max))} までです。`;return}
    tr.innerHTML=diff<=0?`いまの得点ですでに届いています。`:`<b>${need}点</b>（あと <b>${diff}点</b>）で偏差値 ${f1(t)} に届きます。`};
  ti.addEventListener("input",upd);
  const bump=k=>{const t=num(ti.value);const v=(t===null?Math.round(r.dev):t)+k;ti.value=String(Math.round(v*10)/10);upd()};
  document.getElementById("t-up").onclick=()=>bump(1);
  document.getElementById("t-down").onclick=()=>bump(-1);
  upd();
}

function renderOv(){
  const rows=SUBJ.filter(s=>s.id!=="total").map(s=>{let r=calc(state.data[s.id]);if(r.fifty)r={err:1};
    return `<tr><td><span class="dot" style="--c:${C(s.id)}"></span>${s.name}</td><td>${r.err?"—":"+"+f2(r.per)}</td><td>${r.err?"—":f1(r.sd/10)+"点"}</td><td>${r.err?"—":"+"+f1(10*r.per)}</td></tr>`}).join("");
  document.getElementById("ov").innerHTML=`<thead><tr><th>教科</th><th>1点で</th><th>偏差値+1に</th><th>+10点で</th></tr></thead><tbody>${rows}</tbody>`;
}

document.getElementById("reset").onclick=()=>{
  SUBJ.forEach(s=>state.data[s.id]={mean:"",score:"",dev:"",max:s.max,sd:"",target:""});
  state.example=false;save();renderSheet();renderOv()};
renderTabs();renderSheet();renderOv();
</script>

</body>
</html>
